[project]
name = "KMZ 2024 Replication"
description = "Replication of Kelly, Malamud & Zhou (2024), The Virtue of Complexity in Return Prediction"
maintainer = "ahmedas91"
contributors = ["ahmedas91"]
os_compatibility = ["Windows", "Linux", "macOS"]
build = """
module load anaconda3/3.11.4 TeXLive/2023
doit
"""

[notebooks]


[notebooks.01_example_notebook_interactive]
name = "Example Notebook Interactive"
description = "Example notebook for demonstrating how to construct a Chartbook notebook."
path = "_output/01_example_notebook_interactive.ipynb"




[dataframes]


[dataframes.kmz_dataset]
name = "KMZ tidy dataset"
description = "Monthly excess return of the CRSP value-weighted index plus the 15 Kelly-Malamud-Zhou predictors, 1926 onward."
sources = ["Goyal-Welch predictor workbook", "CRSP monthly index (WRDS)"]
providers = ["Amit Goyal", "CRSP via WRDS"]
provider_links = ["https://sites.google.com/view/agoyal145", "https://wrds-www.wharton.upenn.edu/"]
tags = ["monthly", "predictors", "returns"]
pull_method = "doit tidy (builds from the raw pulls via src/clean_goyal_welch.py)"
path = "_data/kmz_dataset.parquet"
docs_path = "docs_src/dataframes/kmz_dataset.md"


[dataframes.kmz_dataset_standardized]
name = "KMZ standardized dataset"
description = "The tidy KMZ dataset after backward-looking volatility standardization; the analysis sample from 1930-01 onward."
sources = ["kmz_dataset (this project)"]
providers = ["Derived in this project"]
provider_links = []
tags = ["monthly", "predictors", "returns", "standardized"]
pull_method = "doit standardize (builds from kmz_dataset via src/standardize_kmz.py)"
path = "_data/kmz_dataset_standardized.parquet"
docs_path = "docs_src/dataframes/kmz_dataset_standardized.md"


[dataframes.oos_grid_T12]
name = "OOS grid statistics (T = 12)"
description = "Across-seed mean out-of-sample statistics of the recursive VoC grid, one row per complexity P and shrinkage z: OOS R2, beta norm, timing-strategy return moments, Sharpe, alpha, IR, and alpha t-stat. The results dataframe behind the Figure 7 and Figure 8 replications."
sources = ["kmz_dataset_standardized (this project)"]
providers = ["Derived in this project"]
provider_links = []
tags = ["oos", "grid", "statistics", "replication"]
pull_method = "doit estimate (src/run_estimation.py driving voc/oos_engine.py)"
path = "_data/oos_grid_T12.parquet"
docs_path = "docs_src/dataframes/oos_grid_T12.md"


[dataframes.oos_grid_T12_per_seed]
name = "OOS grid statistics per seed (T = 12)"
description = "Per-repetition version of the OOS grid: one row per (seed, P, z), the inputs behind the across-seed means. Used for seed-noise diagnostics and anchor-test tolerances."
sources = ["kmz_dataset_standardized (this project)"]
providers = ["Derived in this project"]
provider_links = []
tags = ["oos", "grid", "statistics", "per-seed"]
pull_method = "doit estimate (src/run_estimation.py driving voc/oos_engine.py)"
path = "_data/oos_grid_T12_per_seed.parquet"
docs_path = "docs_src/dataframes/oos_grid_T12_per_seed.md"


[charts]


[charts.figure7]
name = "Figure 7: OOS market timing performance (T = 12)"
description = "Replication of the paper's Figure 7: OOS R2, mean beta norm, timing-strategy expected return, and volatility versus model complexity c = P/T, one line per ridge shrinkage level."
dataframe = "oos_grid_T12"
tags = ["figure", "replication", "oos"]
frequency = "monthly"
path = "_output/figure7.png"
docs_path = "docs_src/charts/figure7.md"


[charts.figure8]
name = "Figure 8: Sharpe ratio, alpha, IR, alpha t-stat (T = 12)"
description = "Replication of the paper's Figure 8, its crux result: market-timing Sharpe ratio, alpha, information ratio, and alpha t-statistic all rising with model complexity c = P/T, one line per ridge shrinkage level plus the ridgeless limit."
dataframe = "oos_grid_T12"
tags = ["figure", "replication", "oos"]
frequency = "monthly"
path = "_output/figure8.png"
docs_path = "docs_src/charts/figure8.md"


[charts.predictor_timeseries]
name = "Standardized predictor time series"
description = "Small-multiples overview of the volatility-standardized market excess return and the 15 KMZ predictors, 1930 onward."
dataframe = "kmz_dataset_standardized"
tags = ["monthly", "predictors", "standardized"]
frequency = "monthly"
path = "_output/predictor_timeseries.png"
docs_path = "docs_src/charts/predictor_timeseries.md"

