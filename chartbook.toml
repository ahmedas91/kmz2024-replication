[project]
name = "KMZ 2024 Replication"
description = "Replication of Kelly, Malamud & Zhou (2024), The Virtue of Complexity in Return Prediction"
maintainer = "ahmedas91"
contributors = ["ahmedas91"]
os_compatibility = ["Windows", "Linux", "macOS"]
build = """
conda env create -f environment.yml
conda activate kmz2024_replication
doit
"""

[notebooks]


[notebooks.01_kmz_tour]
name = "A guided tour of the replication"
description = "Tutorial-style walk through the pipeline: the dataset, the volatility standardization, one estimation window by hand, mini Figure 7/8 curves from the cached grid, and the run_voc_study one-liner."
path = "_output/01_kmz_tour.ipynb"




[dataframes]


[dataframes.kmz_dataset]
name = "KMZ tidy dataset"
description = "Monthly excess return of the CRSP value-weighted index plus the 15 Kelly-Malamud-Zhou predictors, 1926 onward."
sources = ["Goyal-Welch predictor workbook", "CRSP monthly index (WRDS)"]
providers = ["Amit Goyal", "CRSP via WRDS"]
provider_links = ["https://sites.google.com/view/agoyal145", "https://wrds-www.wharton.upenn.edu/"]
tags = ["monthly", "predictors", "returns"]
pull_method = "doit tidy (builds from the raw pulls via src/clean_goyal_welch.py)"
path = "_data/kmz_dataset.parquet"
docs_path = "docs_src/dataframes/kmz_dataset.md"


[dataframes.kmz_dataset_standardized]
name = "KMZ standardized dataset"
description = "The tidy KMZ dataset after backward-looking volatility standardization; the analysis sample from 1930-01 onward."
sources = ["kmz_dataset (this project)"]
providers = ["Derived in this project"]
provider_links = []
tags = ["monthly", "predictors", "returns", "standardized"]
pull_method = "doit standardize (builds from kmz_dataset via src/standardize_kmz.py)"
path = "_data/kmz_dataset_standardized.parquet"
docs_path = "docs_src/dataframes/kmz_dataset_standardized.md"


[dataframes.oos_grid_T12]
name = "OOS grid statistics (T = 12)"
description = "Across-seed mean out-of-sample statistics of the recursive VoC grid, one row per complexity P and shrinkage z: OOS R2, beta norm, timing-strategy return moments, Sharpe, alpha, IR, and alpha t-stat. The results dataframe behind the Figure 7 and Figure 8 replications."
sources = ["kmz_dataset_standardized (this project)"]
providers = ["Derived in this project"]
provider_links = []
tags = ["oos", "grid", "statistics", "replication"]
pull_method = "doit estimate (src/run_estimation.py driving voc/oos_engine.py)"
path = "_data/oos_grid_T12.parquet"
docs_path = "docs_src/dataframes/oos_grid_T12.md"


[dataframes.oos_grid_T12_per_seed]
name = "OOS grid statistics per seed (T = 12)"
description = "Per-repetition version of the OOS grid: one row per (seed, P, z), the inputs behind the across-seed means. Used for seed-noise diagnostics and anchor-test tolerances."
sources = ["kmz_dataset_standardized (this project)"]
providers = ["Derived in this project"]
provider_links = []
tags = ["oos", "grid", "statistics", "per-seed"]
pull_method = "doit estimate (src/run_estimation.py driving voc/oos_engine.py)"
path = "_data/oos_grid_T12_per_seed.parquet"
docs_path = "docs_src/dataframes/oos_grid_T12_per_seed.md"


[dataframes.intl_equity]
name = "Developed ex-US market factors"
description = "Monthly developed-ex-US market excess return (Mkt-RF, already in excess of the US one-month T-bill) and RF from the Ken French data library, converted to decimal, 1990-07 onward. The target of the international VoC study."
sources = ["Ken French data library (Developed_ex_US_3_Factors)"]
providers = ["Kenneth French"]
provider_links = ["https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html"]
tags = ["monthly", "international", "returns"]
pull_method = "doit pull:intl_equity (src/pull_intl_equity.py via pandas_datareader; public, no credentials)"
path = "_data/intl_equity.parquet"
docs_path = "docs_src/dataframes/intl_equity.md"


[dataframes.oos_grid_intl_T12]
name = "International OOS grid statistics (T = 12)"
description = "Across-seed mean OOS statistics of the VoC grid run on the developed-ex-US market excess return with US predictors, one row per (target, P, z). The results dataframe behind the international figure."
sources = ["intl_equity (this project)", "kmz_dataset_standardized (this project)"]
providers = ["Derived in this project"]
provider_links = []
tags = ["oos", "grid", "statistics", "international"]
pull_method = "doit intl_study (src/run_intl_study.py driving voc.run_voc_study)"
path = "_data/oos_grid_intl_T12.parquet"
docs_path = "docs_src/dataframes/oos_grid_intl_T12.md"


[dataframes.bond_returns]
name = "Bond excess returns"
description = "Monthly long-term government (ltr - Rfree) and corporate (corpr - Rfree) bond excess returns, 1926 onward, built from columns already in the Goyal-Welch pull. The targets of the bonds VoC study."
sources = ["Goyal-Welch predictor workbook"]
providers = ["Amit Goyal"]
provider_links = ["https://sites.google.com/view/agoyal145"]
tags = ["monthly", "bonds", "returns"]
pull_method = "doit tidy_bonds (src/clean_bond_returns.py)"
path = "_data/bond_returns.parquet"
docs_path = "docs_src/dataframes/bond_returns.md"


[dataframes.oos_grid_bonds_T12]
name = "Bonds OOS grid statistics (T = 12)"
description = "Across-seed mean OOS statistics of the VoC grid run on the two bond excess-return targets (government and corporate), one row per (target, P, z). The results dataframe behind the bonds figure."
sources = ["bond_returns (this project)", "kmz_dataset_standardized (this project)"]
providers = ["Derived in this project"]
provider_links = []
tags = ["oos", "grid", "statistics", "bonds"]
pull_method = "doit bonds_study (src/run_bonds_study.py driving voc.run_voc_study)"
path = "_data/oos_grid_bonds_T12.parquet"
docs_path = "docs_src/dataframes/oos_grid_bonds_T12.md"


[dataframes.variable_importance_T12]
name = "Variable-importance runs (T = 12)"
description = "Per-seed OOS statistics of the 16 Figure 11 estimations at P = 12,000, z = 1000: the full 15-predictor model plus one leave-one-out model per predictor, tagged by the excluded column. The cache behind the Figure 11 replication."
sources = ["kmz_dataset_standardized (this project)"]
providers = ["Derived in this project"]
provider_links = []
tags = ["oos", "variable-importance", "statistics", "replication"]
pull_method = "doit variable_importance (src/run_variable_importance.py driving voc/oos_engine.py)"
path = "_data/variable_importance_T12.parquet"
docs_path = "docs_src/dataframes/variable_importance_T12.md"


[dataframes.nagel_metrics]
name = "Nagel critique: strategy metrics"
description = "VoC (ridgeless, c = 1000, across-seed mean forecast) versus the recency-weighted momentum benchmark on identical metrics: OOS R2, mean return, volatility, Sharpe, alpha, IR, alpha t-stat."
sources = ["forecasts_market (this project)", "kmz_dataset_standardized (this project)"]
providers = ["Derived in this project"]
provider_links = []
tags = ["nagel", "critique", "statistics"]
pull_method = "doit nagel (src/nagel_analysis.py driving voc/nagel.py)"
path = "_data/nagel_metrics.parquet"
docs_path = "docs_src/dataframes/nagel_metrics.md"


[dataframes.nagel_anatomy]
name = "Nagel critique: forecast anatomy"
description = "Estimated lag weights of the VoC forecast on the trailing 12 standardized returns, next to the benchmark's linearly declining weights - the direct test of the recency-weighted-momentum claim."
sources = ["forecasts_market (this project)", "kmz_dataset_standardized (this project)"]
providers = ["Derived in this project"]
provider_links = []
tags = ["nagel", "critique", "anatomy"]
pull_method = "doit nagel (src/nagel_analysis.py driving voc/nagel.py)"
path = "_data/nagel_anatomy.parquet"
docs_path = "docs_src/dataframes/nagel_anatomy.md"


[dataframes.nagel_spanning]
name = "Nagel critique: spanning regression"
description = "The VoC strategy regressed on the momentum benchmark strategy and the static market: alpha, betas, and the anatomy regression's R2, in one tidy row."
sources = ["forecasts_market (this project)", "kmz_dataset_standardized (this project)"]
providers = ["Derived in this project"]
provider_links = []
tags = ["nagel", "critique", "spanning"]
pull_method = "doit nagel (src/nagel_analysis.py driving voc/nagel.py)"
path = "_data/nagel_spanning.parquet"
docs_path = "docs_src/dataframes/nagel_spanning.md"


[charts]


[charts.figure7]
name = "Figure 7: OOS market timing performance (T = 12)"
description = "Replication of the paper's Figure 7: OOS R2, mean beta norm, timing-strategy expected return, and volatility versus model complexity c = P/T, one line per ridge shrinkage level."
dataframe = "oos_grid_T12"
tags = ["figure", "replication", "oos"]
frequency = "monthly"
path = "_output/figure7.png"
docs_path = "docs_src/charts/figure7.md"


[charts.figure8]
name = "Figure 8: Sharpe ratio, alpha, IR, alpha t-stat (T = 12)"
description = "Replication of the paper's Figure 8, its crux result: market-timing Sharpe ratio, alpha, information ratio, and alpha t-statistic all rising with model complexity c = P/T, one line per ridge shrinkage level plus the ridgeless limit."
dataframe = "oos_grid_T12"
tags = ["figure", "replication", "oos"]
frequency = "monthly"
path = "_output/figure8.png"
docs_path = "docs_src/charts/figure8.md"


[charts.figure11]
name = "Figure 11: variable importance (T = 12)"
description = "Replication of the paper's Figure 11: variable importance for each of the 15 predictors, the change in OOS R2 (bars) and Sharpe ratio (line) moving from the full model to a re-estimated model excluding the variable, at P = 12,000, z = 1000."
dataframe = "variable_importance_T12"
tags = ["figure", "replication", "variable-importance"]
frequency = "monthly"
path = "_output/figure11.png"
docs_path = "docs_src/charts/figure11.md"


[charts.figure_bonds]
name = "Bonds VoC study (T = 12)"
description = "Virtue-of-complexity panels for long-term government and corporate bond excess returns: OOS R2 and Sharpe ratio against model complexity, one row per bond series, same style and grids as the market figures."
dataframe = "oos_grid_bonds_T12"
tags = ["figure", "bonds", "voc", "extension"]
frequency = "monthly"
path = "_output/figure_bonds.png"
docs_path = "docs_src/charts/figure_bonds.md"


[charts.figure_intl]
name = "International equities VoC study (T = 12)"
description = "External-validity test: OOS R2 and Sharpe ratio against model complexity for the developed-ex-US market excess return, forecast with US predictors on the 1991-2020 sample. Same style and grids as the market figures."
dataframe = "oos_grid_intl_T12"
tags = ["figure", "international", "voc", "extension"]
frequency = "monthly"
path = "_output/figure_intl.png"
docs_path = "docs_src/charts/figure_intl.md"


[charts.figure_nagel]
name = "Nagel critique: lag weights"
description = "The VoC forecast's estimated lag weights on the trailing 12 standardized returns versus the momentum benchmark's linearly declining weights - the visual test of Nagel's recency-weighted-momentum claim."
dataframe = "nagel_anatomy"
tags = ["figure", "nagel", "critique"]
frequency = "monthly"
path = "_output/figure_nagel.png"
docs_path = "docs_src/charts/figure_nagel.md"


[charts.predictor_timeseries]
name = "Standardized predictor time series"
description = "Small-multiples overview of the volatility-standardized market excess return and the 15 KMZ predictors, 1930 onward."
dataframe = "kmz_dataset_standardized"
