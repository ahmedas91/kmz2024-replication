name: kmz2024_replication
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.12
  # Analysis
  - joblib
  - matplotlib==3.9.2
  - numpy==1.26.4
  - pandas==2.2.3
  - pyarrow
  - scikit-learn==1.5.2
  # Data access
  - openpyxl==3.1.5
  - pandas-datareader==0.10.0
  - requests==2.32.3
  # Configuration and build
  - doit==0.36.0
  - python-decouple==3.8
  # Tests and lint
  - pytest==8.3.3
  - ruff
  # Notebook build and docs site
  - jupyter
  - jupytext
  - notebook
  - plotly==5.24.1  # used by the example notebook only; retire with issue #13
  - pip
  - pip:
      - chartbook[all]
      - wrds==3.*
