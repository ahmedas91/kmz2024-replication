[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kmz-voc"
version = "0.1.0"
description = "A reusable Virtue-of-Complexity return-prediction engine (Kelly, Malamud & Zhou 2024)"
readme = "README_voc.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jeffrey Key" },
    { name = "Ahmad Mohammad" },
]
keywords = [
    "finance",
    "return prediction",
    "random fourier features",
    "ridge regression",
    "virtue of complexity",
    "machine learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pandas",
    "joblib",
    "pyarrow",
]

[project.urls]
Repository = "https://github.com/ahmedas91/kmz2024-replication"

[tool.setuptools]
packages = ["voc"]

[tool.ruff]
# Assistant tooling docs, not project code.
extend-exclude = [".claude"]

[tool.pytest.ini_options]
# Jupytext notebook scripts are notebooks, not importable modules (their
# names start with a digit); keep --doctest-modules collection off them.
addopts = "--ignore-glob=*.ipynb.py"
